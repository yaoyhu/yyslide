  .slide.statement .titlebar h1 { font-size: 2.8em; }

  .slide.quote blockquote {

  .slide .aigc a { color: rgba(0, 64, 152, .75); }
  /* 打印 / 导出 PDF（?print）：所有页按 16:9 依次排开，每页一张纸，关闭动画。 */
  @page { size: 1280px 720px; margin: 0; }
  html.print, html.print body { height: auto; overflow: visible; }
  html.print .slide {
    position: relative; display: block; width: 100vw; height: 100vh;
    break-after: page; animation: none;
  }
  html.print .slide:is(.stage, .figure, .full) { display: flex; }
  html.print #pager, html.print #progress { display: none; }
  html.print .slide:not(.image-right) .footnotes { right: 4vw; }  /* 打印时没有页码，无需避让 */
  @media print { * { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
</style>
</head>
<body>
<!-- 在 MY_SLIDES 中编辑每一页；每页开头的 h1 会成为顶部标题栏。 -->
<script>
// __SLIDES_DATA_START__
const MY_SLIDES = [
  String.raw`<h1>我的幻灯片</h1>
    <h2>副标题或课程名称</h2>
    <p>演讲者 · 日期</p>
    <blockquote>在这里放一句核心观点。</blockquote>`,

  String.raw`<h1>文字与列表</h1>
    <h2>常用排版</h2>
    <p>支持<strong>重点文字</strong>、<a href="https://example.com">链接</a>和行内 <code>code</code>。</p>
    <ul>
      <li>第一项</li>
      <li>第二项</li>
      <li>第三项</li>
    </ul>
    <blockquote>引用内容</blockquote>`,

  String.raw`<h1>代码与公式</h1>
    <pre><code class="language-python">def hello():
    print("Hello, slides!")
</code></pre>
    <p>行内公式 $E = mc^2$</p>
    <p>$$\int_0^\infty e^{-x^2}\,dx = \frac{\sqrt{\pi}}{2}$$</p>`,
];
// __SLIDES_DATA_END__
</script>
<div id="pager"><span id="cur">1</span> / <span id="total">–</span></div>
<div id="progress"></div>
<script>
// 组装单页：开头的 <h1> 提为 .titlebar（放在 .inner 之外），
// 使标题条不参与整页缩放、左右始终顶格；其余内容进 .inner 等比缩放。
// 页面开头的 <!-- 版式 --> 标记决定版式；首页默认 cover。
const PRINT = new URLSearchParams(location.search).has('print');
if (PRINT) document.documentElement.classList.add('print');
// 地址栏 #/N 记录当前页（从 1 开始），刷新或预览自动重载后停留在同一页
const START = Math.max(0, Math.min(MY_SLIDES.length - 1, (parseInt(location.hash.slice(2)) || 1) - 1));

const LAYOUT_MARKER = /^\s*<!--\s*(cover|section|statement|fact|quote|end|figure|results|agenda|two-cols|compare|three-cols|(?:image-right|image-left|full)(?:\s+crop)?)\s*-->/i;
const STAGE_LAYOUTS = ['cover', 'section', 'statement', 'fact', 'quote', 'end'];
const PANE_LAYOUTS = ['image-right', 'image-left', 'full'];
const COLUMN_LAYOUTS = ['two-cols', 'compare', 'three-cols'];

// 把图片移出所在段落；段落因此变空时一并删除，避免留下多余的空白。
function detachImage(img, target) {
  const parent = img.parentElement;
  target.append(img);
  if (parent.tagName === 'P' && !parent.textContent.trim() && !parent.children.length) parent.remove();
}

// 按 ::col:: 留下的注释把正文分栏
function splitColumns(inner) {
  const cols = document.createElement('div');
  cols.className = 'cols';
  let col = cols.appendChild(document.createElement('div'));
  col.className = 'col';
  [...inner.childNodes].forEach(node => {
    if (node.nodeType === Node.COMMENT_NODE && node.data.trim() === 'col') {
      col = cols.appendChild(document.createElement('div'));
      col.className = 'col';
    } else {
      col.append(node);
    }
  });
  inner.append(cols);
}

// 每张图配一个 <figure>，alt 文字作图注
function wrapFigures(inner) {
  inner.querySelectorAll('img').forEach(img => {
    const figure = document.createElement('figure');
    img.closest('p, .inner > *')?.before(figure);
    if (!figure.parentElement) inner.append(figure);
    detachImage(img, figure);
    if (img.alt) {
      const caption = document.createElement('figcaption');
      caption.textContent = img.alt;
      figure.append(caption);
    }
  });
}

function applyLayout(section, classes) {
  const inner = section.querySelector('.inner');
  const name = classes[0];
  if (PANE_LAYOUTS.includes(name)) {
    const images = [...inner.querySelectorAll('img')];
    if (!images.length) return;  // 没有图片时退回普通版式
    const pane = document.createElement('div');
    pane.className = 'pane';
    images.forEach(img => detachImage(img, pane));
    section.append(pane);
    if (!inner.textContent.trim() && !inner.children.length) inner.classList.add('blank');
  }
  if (COLUMN_LAYOUTS.includes(name)) splitColumns(inner);
  if (name === 'figure') wrapFigures(inner);
  if (STAGE_LAYOUTS.includes(name)) section.classList.add('stage');
  section.classList.add(...classes);
}

function makeSlide(html, i) {
  const section = document.createElement('section');
  const layout = html.match(LAYOUT_MARKER);
  html = html.replace(LAYOUT_MARKER, '');
  // 首页带 no-anim：刷新时直接显示、不播入场动画；首次翻页即移除，此后正常过渡
  section.className = 'slide' + (i === START || PRINT ? ' active no-anim' : '');
  const m = html.match(/^\s*<h1[^>]*>[\s\S]*?<\/h1\s*>/i);
  const title = m ? '<div class="titlebar">' + m[0].trim() + '</div>' : '';
  const body = m ? html.slice(m[0].length) : html;
  section.innerHTML = title + '<div class="inner">' + body + '</div>';
  const notes = section.querySelector('.inner > .footnotes');
  if (notes) section.append(notes);
  const classes = layout ? layout[1].toLowerCase().split(/\s+/) : i === 0 ? ['cover'] : [];
  if (classes.length) applyLayout(section, classes);
  return section;
}

const slides = MY_SLIDES.map((html, i) => makeSlide(html, i));
slides.forEach(s => document.body.insertBefore(s, document.getElementById('pager')));

let i = START;
const cur = document.getElementById('cur');
const total = document.getElementById('total');
const progress = document.getElementById('progress');

cur.textContent = i + 1;
total.textContent = slides.length;
progress.style.width = `${(i + 1) / slides.length * 100}%`;

// 每页首次显示时再高亮；已高亮过的跳过（highlight.js 对重复高亮会在控制台报警告）
function highlight(s) {
  if (window.hljs) s.querySelectorAll('pre code:not([data-highlighted])').forEach(el => hljs.highlightElement(el));
}

// 语法错误显示在图的位置，同时记入此列表，由 `yyslide pdf` 打印到终端
window.YYSLIDE_WARNINGS = [];
// 按固定字号布局，图的结构不随窗口变化；显示大小由外层的 em 宽度决定，与正文同比缩放
const DIAGRAM_PX = 16;          // 布局字号
const DIAGRAM_EM = .82;         // 图内文字相对正文的比例
const DIAGRAM_MAX_WIDTH = 980;  // 16:9 下正文宽度对应的布局宽度
let diagramCount = 0;

// ```mermaid 代码块 → SVG。容器带 mathjax_ignore：MathJax 每次翻页都扫描全文，否则会把标签里的 $ 当成公式。
function renderDiagrams(s) {
  if (!window.pele) return;
  const root = getComputedStyle(document.documentElement);
  s.querySelectorAll('pre > code.language-mermaid').forEach(code => {
    const box = document.createElement('div');
    const source = code.textContent;
    code.parentElement.replaceWith(box);
    try {
      const { svg, width } = pele.render(source, {
        fontSize: DIAGRAM_PX,
        fontFamily: root.getPropertyValue('--sans'),
        // 不用 JetBrains Mono：网页字体此时可能未加载，测量会与最终显示不一致
        fontFamilyMono: root.getPropertyValue('--mono-system'),
        maxWidth: DIAGRAM_MAX_WIDTH,
        autoDirection: false,
        idPrefix: `diagram-${++diagramCount}`,  // 渐变、无障碍标题等带 id，多张图之间不能重名
      });
      box.className = 'diagram mathjax_ignore';
      box.style.width = `${width / DIAGRAM_PX * DIAGRAM_EM}em`;
      box.innerHTML = svg;
    } catch (e) {
      box.className = 'diagram-error mathjax_ignore';
      box.textContent = e.message;
      window.YYSLIDE_WARNINGS.push(`第 ${slides.indexOf(s) + 1} 页：Mermaid 图有误：${e.message}`);
    }
  });
}

// 目录页：列出全部 section 页，高亮本页所属的章节，点击跳转。
function buildAgendas() {
  const sections = slides.filter(s => s.classList.contains('section'));
  slides.filter(s => s.classList.contains('agenda')).forEach(page => {
    if (!sections.length) {
      window.YYSLIDE_WARNINGS.push(`第 ${slides.indexOf(page) + 1} 页：目录页没有可列出的章节，需要用 <!-- section --> 标记章节页`);
      return;
    }
    const at = slides.indexOf(page);
    const current = sections.filter(s => slides.indexOf(s) <= at).pop();
    const list = document.createElement('ol');
    list.className = 'agenda-list';
    sections.forEach(s => {
      const item = list.appendChild(document.createElement('li'));
      if (s === current) item.className = 'now';
      const link = item.appendChild(document.createElement('a'));
      link.href = `#/${slides.indexOf(s) + 1}`;
      const heading = s.querySelector('.titlebar h1');
      if (heading) {
        link.innerHTML = heading.innerHTML;
        link.querySelectorAll('sup.footnote-ref').forEach(sup => sup.remove());
      }
    });
    page.querySelector('.inner').prepend(list);
  });
}
buildAgendas();

// 每页首次显示时的处理。先渲染图，mermaid 代码块才不会被当作普通代码高亮。
function prepare(s) {
  renderDiagrams(s);
  highlight(s);
}

// 初始高亮/排版当前页（打印模式下为全部页）
(PRINT ? slides : [slides[i]]).forEach(prepare);
fitSlides();
if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise().then(fitSlides, fitSlides);

// 打印模式：等公式、字体和图片全部就绪后排版，再标记 data-ready 供导出 PDF 的浏览器等待
if (PRINT) {
  const mathReady = window.MathJax && MathJax.startup && MathJax.startup.promise
    ? MathJax.startup.promise.then(() => MathJax.typesetPromise && MathJax.typesetPromise())
    : Promise.resolve();
  const imagesReady = () => Promise.all([...document.images].map(img => img.complete ? null
    : new Promise(r => { img.addEventListener('load', r); img.addEventListener('error', r); })));
  mathReady.catch(() => {})
    .then(() => document.fonts && document.fonts.ready)
    .then(imagesReady)
    .then(() => {
      fitSlides();
      requestAnimationFrame(() => requestAnimationFrame(() => { document.documentElement.dataset.ready = '1'; }));
    });
}

function show(n) {
  const target = Math.max(0, Math.min(n, slides.length - 1));
  if (target === i) return;                       // 越界翻页：不动
  const dir = target > i ? 1 : -1;                // 前进从右推入，后退从左推入
  const old = slides[i];
  slides.forEach(s => s.classList.remove('leaving', 'no-anim'));
  old.style.setProperty('--dir', dir);
  old.classList.remove('active');
  old.classList.add('leaving');                   // 旧页保持在下层，动画结束再隐藏
  old.addEventListener('animationend', () => old.classList.remove('leaving'), { once: true });
  i = target;
  slides[i].style.setProperty('--dir', dir);
  slides[i].classList.add('active');
  cur.textContent = i + 1;
  total.textContent = slides.length;
  progress.style.width = `${(i + 1) / slides.length * 100}%`;
  history.replaceState(null, '', `#/${i + 1}`);
  window.scrollTo(0, 0);
  prepare(slides[i]);
  fitSlides();
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise().then(fitSlides, fitSlides);
}

// 在地址栏手动修改 #/N 时跳到对应页（show 用 replaceState 更新地址，不会触发此事件）
window.addEventListener('hashchange', () => {
  const n = parseInt(location.hash.slice(2));
  if (n) show(n - 1);
});

// 二分查找满足 fits() 的最大字号
function fitFont(el, max, fits) {
  let lo = 0, hi = max;
  for (let n = 0; n < 16; n++) {
    const size = (lo + hi) / 2;
    el.style.fontSize = `${size}px`;
    if (fits()) lo = size;
    else hi = size;
  }
  el.style.fontSize = `${lo}px`;
}

// 标题和脚注保留独立字号；正文按扣除标题、脚注、padding 后的真实空间等比缩小。
function fitSlides() {
  slides.forEach(s => {
    if (!s.classList.contains('active') && !PRINT) return; // 隐藏页没有可测量的尺寸
    const inner = s.querySelector('.inner');
    const title = s.querySelector('.titlebar');
    const notes = s.querySelector('.footnotes');
    const css = getComputedStyle(s);
    const width = s.clientWidth - parseFloat(css.paddingLeft) - parseFloat(css.paddingRight);
    // 极窄/极矮窗口或长标题：标题最多占用屏幕 30%，给正文留出空间。
    if (title) {
      title.style.fontSize = '';
      fitFont(title, parseFloat(css.fontSize),
        () => title.offsetHeight <= s.clientHeight * .3 && title.scrollWidth <= title.clientWidth);
    }
    // 脚注过长时缩小字号，最多占用屏幕 25%。
    if (notes) {
      notes.style.fontSize = '';
      if (notes.offsetHeight > s.clientHeight * .25) {
        fitFont(notes, parseFloat(getComputedStyle(notes).fontSize), () => notes.offsetHeight <= s.clientHeight * .25);
      }
    }
    const bottom = notes
      ? notes.offsetTop - parseFloat(css.fontSize) * .5
      : s.clientHeight - parseFloat(css.paddingBottom);
    inner.style.transform = 'none';
    const height = Math.max(1, bottom - inner.offsetTop);
    // 高度由同一栏内的图平分；并排的图互不挤占。
    const visuals = 'img, .diagram > svg';
    const stacks = inner.querySelectorAll('.col');
    const stacked = stacks.length
      ? Math.max(...[...stacks].map(col => col.querySelectorAll(visuals).length))
      : inner.querySelectorAll(visuals).length;
    inner.style.setProperty('--image-height', `${height / Math.max(1, stacked)}px`);
    const scale = Math.min(1,
      Math.max(1, width - 1) / Math.max(1, inner.scrollWidth),
      Math.max(1, height - 1) / Math.max(1, inner.scrollHeight, inner.offsetHeight));
    inner.style.transform = `scale(${scale})`;
  });
}
// 合并异步排版事件；transform 不改变布局尺寸，不会触发观察器循环。
let fitFrame;
function scheduleFit() {
  cancelAnimationFrame(fitFrame);
  fitFrame = requestAnimationFrame(fitSlides);
}
slides.forEach(s => {
  if (window.ResizeObserver) {
    const observer = new ResizeObserver(scheduleFit);
    observer.observe(s.querySelector('.inner'));
    const title = s.querySelector('.titlebar');
    if (title) observer.observe(title);
    const notes = s.querySelector('.footnotes');
    if (notes) observer.observe(notes);
  }
  s.addEventListener('load', scheduleFit, true);
  s.addEventListener('error', scheduleFit, true);
});
window.addEventListener('resize', scheduleFit);
window.addEventListener('load', scheduleFit);
if (document.fonts) {
  document.fonts.ready.then(scheduleFit);
  document.fonts.addEventListener('loadingdone', scheduleFit);
}

// 中文输入法开启时 e.key 为 'Process'，大写锁定时为 'J'：
// 先统一小写，无法识别时再按物理键位 e.code 判断（不影响 Dvorak 等布局）。
const CODE_KEYS = { Space: ' ', Enter: 'Enter', Backspace: 'Backspace' };
function keyOf(e) {
  if (e.key.length === 1) return e.key.toLowerCase();
  if (e.key === 'Process' || e.key === 'Unidentified') {
    if (/^Key[A-Z]$/.test(e.code)) return e.code.slice(3).toLowerCase();
    return CODE_KEYS[e.code] || e.key;
  }
  return e.key;
}

// Safari 16.4 之前只有带 webkit 前缀的全屏接口
function toggleFullscreen() {
  const d = document, el = d.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  const exit = d.exitFullscreen || d.webkitExitFullscreen;
  const p = (d.fullscreenElement || d.webkitFullscreenElement) ? exit.call(d) : req.call(el);
  if (p && p.catch) p.catch(() => {});
}

document.addEventListener('keydown', (e) => {
  if (PRINT || e.metaKey || e.ctrlKey || e.altKey) return;  // 不拦截 Cmd+L、Cmd+F 等浏览器快捷键
  switch (keyOf(e)) {
    case ' ': case 'ArrowRight': case 'ArrowDown': case 'j': case 'l': case 'Enter': case 'PageDown':
      e.preventDefault(); show(i + 1); break;
    case 'ArrowLeft': case 'ArrowUp': case 'h': case 'k': case 'Backspace': case 'PageUp':
      e.preventDefault(); show(i - 1); break;
    case 'Home': e.preventDefault(); show(0); break;
    case 'End': e.preventDefault(); show(slides.length - 1); break;
    case 'f': toggleFullscreen(); break;
    case 'q':
      window.close();
      break;
  }
});
</script>
</body>
</html>
